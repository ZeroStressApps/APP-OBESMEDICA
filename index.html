<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolución de mi Peso</title>

<link rel="manifest" href="/APP-OBESMEDICA/manifest.json">
  <meta name="theme-color" content="#16a34a">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    canvas {
      width: 100% !important;
      height: 300px !important;
    }
    td button {
      background: none !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
    }
    td button::before,
    td button::after {
      content: none !important;
      display: none !important;
    }
  </style>
</head>

<body class="bg-green-50 min-h-screen p-4">



  <!-- ==========================
       BLOQUE: SEGUIMIENTO SEMANAL
       ========================== -->
  <div id="menuSemanal" class="block">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-lg">

      <h1 class="text-3xl font-bold text-center text-green-700 mb-2">
        🥑 Evolución de mi Peso 🥝
      </h1>
      <p id="fraseMotivacion" class="text-center text-lg font-semibold text-green-700 mb-6"></p>

      <div class="flex justify-center mb-6">
        <img src="Obesmedica.png" alt="Obesmedica" class="h-20 w-auto" />
      </div>

      <div class="flex gap-4 justify-center mb-6">
  <button onclick="mostrarSemanal()" 
          class="bg-green-600 text-white px-4 py-2 rounded">
    Seguimiento semanal
  </button>

  <button onclick="mostrarMensual()" 
          class="bg-green-700 text-white px-4 py-2 rounded">
    Seguimiento mensual
  </button>
</div>


      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <input id="fecha" type="date" class="border p-2 rounded w-full" />
        <select id="tipoDieta" class="border p-2 rounded w-full">
          <option value="SF">Sin fruta</option>
          <option value="CF">Con fruta</option>
        </select>
        <input id="peso" type="number" step="0.1" class="border p-2 rounded w-full" placeholder="Peso (kg)" />
        <button onclick="agregarPeso()" class="bg-green-600 text-white p-2 rounded hover:bg-green-700">Añadir</button>
      </div>

 
      <table class="w-full mb-2">
     <thead>
  <tr class="bg-green-200">
  <th class="p-2">
  <div class="flex items-center justify-center gap-2">
    <span>Fecha</span>

    <!-- Contenedor de flechas -->
    <div class="flex gap-1">
      <button onclick="ordenarAsc()" class="text-green-700 text-lg font-bold">
        ⬆️
      </button>
      <button onclick="ordenarDesc()" class="text-green-700 text-lg font-bold">
        ⬇️
      </button>
    </div>
  </div>
</th>


    <th class="p-2">Dieta</th>
    <th class="p-2">Variación</th>
    <th class="p-2">Peso (kg)</th>
    <th class="p-2">Borrar</th>
  </tr>
</thead>

        <tbody id="tabla"></tbody>
      </table>

      <p id="totalPerdido" class="text-right text-green-700 font-bold mb-6"></p>
      <p id="desgloseDietas" class="text-right text-green-700 font-semibold mb-6"></p>

      <h2 class="text-xl font-bold text-green-700 mb-2">📉 Gráfico de evolución</h2>
      <canvas id="grafico"></canvas>

      <div class="flex gap-3 mt-6">
  <button onclick="exportarDatos()"
          class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700 w-full">
    Exportar datos ⬇️
  </button>

  <label class="bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 w-full text-center cursor-pointer">
    Importar datos ⬆️
    <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importarDatos(event)">
  </label>
</div>
      
      <button onclick="limpiarTodo()" class="bg-red-500 text-white p-2 mt-6 rounded hover:bg-red-600 w-full">
        Limpiar todo 🚮
      </button>

    </div>
  </div>

  <!-- ==========================
       BLOQUE: SEGUIMIENTO MENSUAL
       ========================== -->
  <div id="menuMensual" class="hidden">
<div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-lg">

  <!-- Botón volver -->
  <button onclick="mostrarSemanal()"
          class="bg-green-600 text-white px-4 py-2 rounded mb-6">
    ← Volver
  </button>

  <h1 class="text-3xl font-bold text-center text-green-700 mb-4">
    📅 Seguimiento mensual
  </h1>

  <p class="text-center text-gray-700 mb-6">
    Introduce tu altura para calcular el IMC.
  </p>

  <!-- CAMPO ALTURA -->
  <div class="flex justify-center mb-6">
    <input id="alturaUsuario"
           type="number"
           step="0.01"
           placeholder="Altura en centímetros (ej. 1.60)"
           class="border p-2 rounded w-40 text-center">
    <button onclick="actualizarMensual()"
            class="bg-green-600 text-white px-4 py-2 rounded ml-3">
      Calcular IMC
    </button>
  </div>

  <!-- TABLA MENSUAL -->
  <table class="w-full mb-6">
    <thead>
      <tr class="bg-green-200">
        <th class="p-2">Fecha</th>
        <th class="p-2">IMC</th>
      </tr>
    </thead>
    <tbody id="tablaMensual"></tbody>
  </table>

</div>


  <script>
    // -------------------------
    // DATOS
    // -------------------------
    let datos = JSON.parse(localStorage.getItem("registroPeso")) || [];
    let grafico = null;
    let ordenActual = "asc";

    function guardar() {
      localStorage.setItem("registroPeso", JSON.stringify(datos));
    }
function exportarDatos() {
  const datosBackup = localStorage.getItem("registroPeso") || "[]";

  const blob = new Blob([datosBackup], {
    type: "application/json"
  });

  const archivo = new File(
    [blob],
    "registroPeso_backup.json",
    { type: "application/json" }
  );

  // Intentar compartir el archivo desde el móvil
  if (
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({ files: [archivo] })
  ) {
    navigator.share({
      title: "Backup de mi peso",
      text: "Copia de seguridad de mis registros de peso",
      files: [archivo]
    }).catch(() => {});
    
    return;
  }

  // Si no se puede compartir, abrir el JSON en una nueva pestaña
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 10000);
}

    function importarDatos(event) {
  const file = event.target.files[0];

  if (!file) {
    alert("No se ha seleccionado ningún archivo.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const datosImportados = JSON.parse(e.target.result);

      if (!Array.isArray(datosImportados)) {
        alert("El archivo no contiene datos válidos.");
        return;
      }

      if (!confirm("Esto reemplazará los datos actuales. ¿Quieres continuar?")) {
        return;
      }

      datos = datosImportados;

      datos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

      guardar();
      actualizarTabla();
      actualizarGrafico();

      alert("¡Datos importados correctamente! ✅");

    } catch (error) {
      alert("No se ha podido leer el archivo. Comprueba que sea el backup de esta aplicación.");
      console.error(error);
    }

    event.target.value = "";
  };

  reader.onerror = function() {
    alert("No se ha podido leer el archivo.");
  };

  reader.readAsText(file);
}
    
    function formatearFecha(fechaISO) {
      if (!fechaISO) return "";
      const [a, m, d] = fechaISO.split("-");
      return `${d}.${m}.${a}`;
    }

    // -------------------------
    // FRASE MOTIVADORA
    // -------------------------
    const frases = [
      "Un día más sumando, no restando.",
      "Cada paso cuenta, aunque sea pequeño.",
      "Tu yo del futuro te va a dar las gracias.",
      "Sigue así, ya has demostrado que puedes.",
      "No es magia, es constancia. Y tú la tienes.",
      "Hoy también merece la pena intentarlo."
    ];

    function mostrarFrase() {
      const frase = frases[Math.floor(Math.random() * frases.length)];
      const el = document.getElementById("fraseMotivacion");
      if (el) el.textContent = frase;
    }

    // -------------------------
    // OPERACIONES PRINCIPALES
    // -------------------------
    function agregarPeso() {
      const fecha = document.getElementById("fecha").value;
      const peso = parseFloat(document.getElementById("peso").value);
      const tipoDieta = document.getElementById("tipoDieta").value;

      if (!fecha || isNaN(peso)) {
        alert("Completa los dos campos.");
        return;
      }

      datos.push({ fecha, peso, tipoDieta });

      datos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

      guardar();
      actualizarTabla();
      actualizarGrafico();
    }

    function borrarPeso(index) {
      if (!confirm("¿Borrar este registro?")) return;
      datos.splice(index, 1);
      guardar();
      actualizarTabla();
      actualizarGrafico();
    }

    function limpiarTodo() {
      if (!confirm("¿Seguro que quieres borrar todo?")) return;
      datos = [];
      guardar();
      actualizarTabla();
      actualizarGrafico();
    }

    // -------------------------
    // TOTAL PERDIDO
    // -------------------------
    function calcularTotalPerdido() {
      const textoEl = document.getElementById("totalPerdido");
      const desgloseEl = document.getElementById("desgloseDietas");

      if (datos.length < 2) {
        textoEl.textContent = "";
        desgloseEl.textContent = "";
        return;
      }

      const ordenados = [...datos].sort(
        (a, b) => new Date(a.fecha) - new Date(b.fecha)
      );

      const primero = ordenados[0].peso;
      const ultimo = ordenados[ordenados.length - 1].peso;

      const diff = +(ultimo - primero).toFixed(1);

      let texto;
      if (diff < 0) texto = `Total perdido: ${Math.abs(diff)} kg`;
      else if (diff > 0) texto = `Has ganado ${diff} kg`;
      else texto = "Sin cambios";

      textoEl.textContent = texto;

// --- Comparativa SF vs CF (media por registro) ---
let sumaSF = 0;   // suma de variaciones (negativo = bajas)
let sumaCF = 0;

let countSF = 0;  // cuántas veces aparece como "registro actual"
let countCF = 0;

for (let i = 1; i < ordenados.length; i++) {
  const prev = ordenados[i - 1];
  const curr = ordenados[i];

  const diff = +(curr.peso - prev.peso).toFixed(1); // + sube, - baja

  if (curr.tipoDieta === "SF") {
    sumaSF += diff;
    countSF++;
  } else if (curr.tipoDieta === "CF") {
    sumaCF += diff;
    countCF++;
  }
}

const mediaSF = countSF ? +(sumaSF / countSF).toFixed(2) : 0;
const mediaCF = countCF ? +(sumaCF / countCF).toFixed(2) : 0;

const pctSF = datos.length ? ((datos.filter(d => d.tipoDieta === "SF").length / datos.length) * 100).toFixed(0) : "0";
const pctCF = datos.length ? ((datos.filter(d => d.tipoDieta === "CF").length / datos.length) * 100).toFixed(0) : "0";

desgloseEl.textContent =
  `SF: ${mediaSF} kg/registro (${countSF} cambios, ${pctSF}%) | ` +
  `CF: ${mediaCF} kg/registro (${countCF} cambios, ${pctCF}%)`;
    }
// ==========================
// SEGUIMIENTO MENSUAL
// ==========================
function actualizarMensual() {
  const tabla = document.getElementById("tablaMensual");
  const alturaInput = document.getElementById("alturaUsuario");

  if (!tabla || !alturaInput) return;

 // Altura en centímetros
const alturaCm = parseFloat(alturaInput.value);

// Validación
if (isNaN(alturaCm) || alturaCm <= 0) {
  tabla.innerHTML = `
    <tr><td colspan="2" class="p-4 text-center text-red-600">
      Introduce una altura válida.
    </td></tr>
  `;
  return;
}

// Convertir a metros
const altura = alturaCm / 100;


  tabla.innerHTML = "";

  const ordenados = [...datos].sort(
    (a, b) => new Date(a.fecha) - new Date(b.fecha)
  );

  ordenados.forEach(entry => {
    const imc = (entry.peso / (altura * altura)).toFixed(1);

    tabla.innerHTML += `
      <tr class="border-b">
        <td class="p-2">${formatearFecha(entry.fecha)}</td>
        <td class="p-2">${imc}</td>
      </tr>
    `;
  });
}

    // -------------------------
    // TABLA
    // -------------------------
    function actualizarTabla() {
      const tabla = document.getElementById("tabla");
      tabla.innerHTML = "";

      const variaciones = datos.map((item, i) => {
        if (i === 0) return "-";
        const diff = item.peso - datos[i - 1].peso;
        return diff.toFixed(1) + " kg";
      });

      const indices = datos.map((_, i) => i);
      if (ordenActual === "desc") indices.reverse();

     indices.forEach((idx) => {
  const entry = datos[idx];
  const variacion = variaciones[idx];

  let color = "text-gray-700";

  if (variacion !== "-") {
    const num = parseFloat(variacion);

    if (num > 0) color = "text-red-600 font-bold";   // peso sube
    if (num < 0) color = "text-green-600 font-bold"; // peso baja
  }

  tabla.innerHTML += `
    <tr class="border-b">
      <td class="p-2">${formatearFecha(entry.fecha)}</td>
      <td class="p-2">${entry.tipoDieta || "-"}</td>
      <td class="p-2 ${color}">${variacion}</td>
      <td class="p-2">${entry.peso}</td>
            <td class="p-2 text-center">
              <button onclick="borrarPeso(${idx})" class="text-purple-600 font-bold text-xl">✖</button>
            </td>
          </tr>
        `;
      });

      calcularTotalPerdido();
    }

    // -------------------------
    // GRÁFICO
    // -------------------------
    function actualizarGrafico() {
      const canvas = document.getElementById("grafico");
      const ctx = canvas.getContext("2d");

      if (grafico) grafico.destroy();

      const ordenados = [...datos].sort(
        (a, b) => new Date(a.fecha) - new Date(b.fecha)
      );

      grafico = new Chart(ctx, {
        type: "line",
        data: {
          labels: ordenados.map((e) => formatearFecha(e.fecha)),
          datasets: [
            {
              label: "Peso (kg)",
              data: ordenados.map((e) => e.peso),
              borderColor: "#16a34a",
              backgroundColor: "#86efac",
              tension: 0.3,
            },
          ],
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: false } },
        },
      });
    }

    // -------------------------
    // ORDEN VISUAL
    // -------------------------
    function ordenarAsc() {
      ordenActual = "asc";
      actualizarTabla();
    }

    function ordenarDesc() {
      ordenActual = "desc";
      actualizarTabla();
    }

    // -------------------------
    // CAMBIO DE MENÚS
    // -------------------------
    function mostrarSemanal() {
      document.getElementById("menuSemanal").classList.remove("hidden");
      document.getElementById("menuSemanal").classList.add("block");

      document.getElementById("menuMensual").classList.add("hidden");
      document.getElementById("menuMensual").classList.remove("block");
    }

function mostrarMensual() {
  document.getElementById("menuMensual").classList.remove("hidden");
  document.getElementById("menuMensual").classList.add("block");

  document.getElementById("menuSemanal").classList.add("hidden");
  document.getElementById("menuSemanal").classList.remove("block");

  actualizarMensual(); // <-- carga la tabla al entrar
}



    // -------------------------
    // INICIO
    // -------------------------
    mostrarFrase();
    actualizarTabla();
    actualizarGrafico();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
